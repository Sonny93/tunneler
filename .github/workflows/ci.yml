name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  ssh-config-differential:
    name: ssh-config differential (OpenSSH 10.0 on Debian)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update
          apt-get install -y openssh-client curl ca-certificates build-essential git
      - run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run the differential test and fail if it was skipped
        shell: bash
        run: |
          # ssh expands ~ with the passwd home, the resolver with HOME: the container sets HOME to /github/home.
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          HOME="$(getent passwd "$(id -u)" | cut -d: -f6)"
          export HOME
          cargo test --locked -p ssh-config --test differential -- --nocapture 2>&1 | tee differential.log
          if grep -q "skipping differential tests" differential.log; then
            echo "::error::the differential test was skipped; the oracle is not OpenSSH 10.0"
            exit 1
          fi

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm check
        working-directory: app
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test
        working-directory: app
      - run: pnpm build
        working-directory: app
      - name: Stage the daemon as the Windows sidecar
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --locked -p tunneler
          New-Item -ItemType Directory -Force app/src-tauri/binaries | Out-Null
          Copy-Item target/debug/tunneler.exe app/src-tauri/binaries/tunneler-x86_64-pc-windows-msvc.exe
      - run: cargo clippy -p tunneler-ui --all-targets --locked -- -D warnings
      - run: cargo build -p tunneler-ui --locked
