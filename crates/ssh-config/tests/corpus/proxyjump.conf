# aliases: a b c d e f g h i
# ProxyJump lists and URIs, and the first-wins interplay with ProxyCommand.
Host a
    ProxyJump bastion
Host b
    ProxyJump user@bastion:2222,second
Host c
    ProxyJump ssh://u@jump.example.com:2200
Host d
    ProxyJump [::1]:2222,192.0.2.1
Host e
    ProxyJump none
    ProxyCommand ssh -W %h:%p other
Host f
    ProxyCommand ssh -W %h:%p first
    ProxyJump later
Host g
    ProxyJump a,ssh://u%40x@h2
Host h
    ProxyCommand none
    ProxyJump never
Host i
    ProxyJump one,two,three
    ProxyJump ignored
