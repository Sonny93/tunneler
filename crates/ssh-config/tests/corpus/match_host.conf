# aliases: alias other.example.com plain
# Match host sees the Hostname set so far; originalhost sees the alias.
Match host real.example.com
    Tag before-hostname

Host alias
    HostName real.example.com

Match host real.example.com
    User by-real-host
    Port 2022

Match host REAL.example.COM,other
    CertificateFile ~/.ssh/by-list

Match originalhost alias
    Compression yes

Match originalhost real.example.com
    BatchMode yes

Match host !real.example.com
    Tag not-real

Match host *.example.com originalhost other.example.com
    ServerAliveInterval 11
