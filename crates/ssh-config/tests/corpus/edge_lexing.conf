# aliases: a b c d e
# Odd but valid spacing, several aliases per Host line, quoting, and `=` around values.
Host    a
  HostName	tabbed.example.com
Host "b" 'c'
  HostName = shared.example.com
  Port="2323"
Host d
	User=dee
	IdentityFile="@DIR@/with space/key"
	IdentityFile "@DIR@/second key"
	SendEnv=LANG LC_* # comment after values
	SetEnv ="A=b c"
Host e
    LocalForward 1234 "localhost:1234"
    ServerAliveInterval=1m30s
