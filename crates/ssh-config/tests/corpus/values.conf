# aliases: values agent agent2 agent3 agent4
# forwardx11trusted: values
# Typed values: booleans, enums, times, agents, known hosts files.
Host values
    AddressFamily inet
    BatchMode true
    ExitOnForwardFailure true
    GatewayPorts yes
    ForwardX11 yes
    ForwardX11Trusted no
    HashKnownHosts yes
    StrictHostKeyChecking off
    PubkeyAuthentication unbound
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    NumberOfPasswordPrompts 1
    ConnectionAttempts 4
    ConnectTimeout 1m30s
    TCPKeepAlive no
    Compression yes
    PreferredAuthentications publickey,password
    HostKeyAlias MixedCaseAlias
    AddKeysToAgent confirm 5m
    ForwardAgent yes
    ServerAliveInterval 1h
    GlobalKnownHostsFile @DIR@/g1 @DIR@/g2
    UserKnownHostsFile none
    ChallengeResponseAuthentication yes
    KeepAlive yes

Host agent
    ForwardAgent @DIR@/agent.sock
    IdentityAgent SSH_AUTH_SOCK
    AddKeysToAgent 2h
    PubkeyAuthentication host-bound
    StrictHostKeyChecking accept-new

Host agent2
    ForwardAgent $MY_AGENT
    IdentityAgent $SOME_AGENT
    AddKeysToAgent ask
    ConnectTimeout none
    ConnectTimeout 5

Host agent3
    IdentityAgent none
    ForwardAgent no
    StrictHostKeyChecking yes
    AddKeysToAgent yes
    AddressFamily any

Host agent4
    IdentityAgent ${HOME}/agent.sock
    GlobalKnownHostsFile none
    UserKnownHostsFile @DIR@/one @DIR@/two
    StrictHostKeyChecking ask
    PubkeyAuthentication no
    SetEnv A=1 B=two
    SendEnv LANG
