# aliases: active other elsewhere
# home: yes
# Include: absolute, relative (to ~/.ssh), glob (sorted), nested, inside active and inactive Host blocks.
# Host/Match lines of an included file apply to it, and the including block's state is restored after it.
UserKnownHostsFile @DIR@/known_hosts

Host active
    Include @DIR@/inc/a.conf
    Include extra.conf
    Include @DIR@/glob/*.conf
    Include @DIR@/does/not/exist/*.conf
    Include @DIR@/inc/inner_host.conf
    Compression yes

Host other
    Include @DIR@/inc/never.conf
    Include @DIR@/inc/nested_a.conf

Host elsewhere
    Include @DIR@/inc/nested_a.conf

Host *
    IdentityFile ~/kz
#@file inc/a.conf
User fromA
IdentityFile ~/ka
Match host nomatch
    Port 9999
#@file home/.ssh/extra.conf
Port 2200
Host nothing
#@file glob/b.conf
ServerAliveInterval 2
#@file glob/a.conf
ServerAliveInterval 1
Tag glob-a
#@file inc/never.conf
User never
Port 7777
IdentityFile ~/knever
#@file inc/nested_a.conf
Include @DIR@/inc/nested_b.conf
#@file inc/nested_b.conf
Include @DIR@/inc/nested_c.conf
Tag nested-b
#@file inc/nested_c.conf
BatchMode yes
#@file inc/inner_host.conf
Host active
    GatewayPorts yes
Host unrelated
    ExitOnForwardFailure yes
