# aliases: web jumped upper v6
# Tokens (%h %p %r %u %n %d %C %L %l %i %j %k %%), `~` and ${VAR} in the directives that accept them.
UserKnownHostsFile @DIR@/kh_%C @DIR@/kh_%h_%p_%r_%n_%k_%u_%L_%i_%j_%%
IdentityAgent @DIR@/agent_%r_%h.sock

Host web
    HostName %h.example.com
    User deploy
    Port 2222
    IdentityFile ~/.ssh/k_%r
    IdentityFile %d/.ssh/k_%h_%n
    IdentityFile ${HOME}/.ssh/k_env_%p
    CertificateFile ~/.ssh/c_%r-cert.pub
    ProxyCommand ssh -W %h:%p -l %r %n bastion_%k %%
    HostKeyAlias KeyAlias
    LocalForward @DIR@/l_%r.sock localhost:80
    RemoteForward @DIR@/r_%p.sock /tmp/%n.sock
    SetEnv WHO=%r@%h HOMEDIR=${HOME}

Host jumped
    HostName jumped.example.com
    User juser
    ProxyJump u@bastion.example.com:2200,last.example.com
    IdentityFile ~/.ssh/j_%j_%C

Host upper
    HostName UPPER.Example.COM
    IdentityFile ~/%n

Host v6
    HostName 2001:DB8::ABCD
