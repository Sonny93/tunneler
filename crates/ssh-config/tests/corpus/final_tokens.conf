# aliases: web
# Hostname set in a Host block is the one seen by Match host and by the final pass; Include sees the final host.
Match final
    Include @DIR@/final/%h.conf
    Include @DIR@/final_alias/%n.conf

Host web
    HostName Web.Real.EXAMPLE.org

Match host web.real.example.org
    Tag lowercase-match

Host web.real.example.org
    User final-pass-user
#@file final/web.real.example.org.conf
Port 2200
#@file final_alias/web.conf
ServerAliveCountMax 2
