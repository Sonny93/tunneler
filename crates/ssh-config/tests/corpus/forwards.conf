# aliases: x cleared
# Forwarding formats: bind addresses, IPv6, Unix sockets, remote SOCKS, duplicates, ClearAllForwardings.
Host x
    LocalForward 3333 localhost:3333
    LocalForward [::1]:4444 [fe80::1]:5555
    LocalForward 1.2.3.4:6000 /tmp/s.sock
    LocalForward /tmp/l.sock host:80
    LocalForward /tmp/l2.sock /tmp/r.sock
    LocalForward 3333 localhost:3333
    LocalForward 127.0.0.1:7000 db.internal:5432
    DynamicForward 1080
    DynamicForward 0.0.0.0:1081
    DynamicForward [::]:1082
    DynamicForward /tmp/socks.sock
    RemoteForward 9000 localhost:9000
    RemoteForward 9001
    RemoteForward 0 h:1
    RemoteForward *:9002 h:2
    RemoteForward [bind]:9003 h:3
    RemoteForward /tmp/remote.sock localhost:22
    GatewayPorts yes

Host cleared
    LocalForward 1 a:2
    RemoteForward 3 b:4
    DynamicForward 5
    ClearAllForwardings yes
