# aliases: x
# Match sees the state built so far: Hostname with %h expanded, and the User set above it.
Match host x.example.com
    Tag early

Host x
    HostName %h.example.com

Match host x.example.com
    Tag late
    User late-user

Match user late-user
    Port 3141

Match !host x.example.com
    BatchMode yes

Match user jules
    Compression yes
