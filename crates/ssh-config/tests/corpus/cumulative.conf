# aliases: acc other
# IdentityFile, CertificateFile, the forwards and SendEnv accumulate; SetEnv is first-wins.
Host acc
    IdentityFile ~/.ssh/k1
    IdentityFile ~/.ssh/k2
    CertificateFile ~/.ssh/c1
    LocalForward 8080 localhost:80
    LocalForward 8080 localhost:80
    RemoteForward 9090 localhost:90
    DynamicForward 1080
    SendEnv LANG LC_*
    SendEnv TERM
    SetEnv A=1 B=2

Host *
    IdentityFile ~/.ssh/k3
    IdentityFile ~/.ssh/k1
    CertificateFile ~/.ssh/c2
    LocalForward 8081 localhost:81
    RemoteForward 9091 localhost:91
    DynamicForward 1081
    SendEnv -LC_ALL -TERM
    SendEnv EDITOR
    SetEnv C=3
