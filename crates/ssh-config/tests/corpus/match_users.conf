# aliases: a b
# Match user (remote user so far) and localuser (the local account).
Host a
    User bob

Match user bob
    Port 2001

Match user alice,carol
    Port 2002

Match user !bob host a
    Port 2003

Match localuser @USER@
    ServerAliveCountMax 5

Match !localuser @USER@
    ServerAliveCountMax 6

Match localuser nobody-at-all,@USER@
    Tag localmatch

Match user bob localuser @USER@ host b
    HashKnownHosts yes
