# aliases: web real.example.com other
# Match final and canonical trigger a second pass, where Host lines match the resolved host name.
Host web
    HostName real.example.com
    IdentityFile ~/k1

Host real.example.com
    User from-real-host
    IdentityFile ~/k2
    LocalForward 1 a:2

Host web
    SendEnv A

Match final host real.example.com
    Port 2222
    IdentityFile ~/k3
    SendEnv A B

Match originalhost web
    Tag original

Match canonical host real.example.com
    ServerAliveInterval 17

Match !final
    BatchMode yes

Host other
    HostName web
