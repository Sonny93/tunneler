# aliases: one two three
# Single-valued directives keep their first value, in file order.
Host one
    User first
    Port 1111

Host one two
    User second
    Port 2222
    HostName second.example.com
    ServerAliveCountMax 9

Host *
    User fallback
    Port 3333
    HostName fallback.example.com
    ServerAliveCountMax 4
    ServerAliveInterval 5m
    ConnectTimeout 10
    ConnectTimeout 20
    ServerAliveInterval none
