# aliases: x y
# Match exec runs the command through the shell; tokens are expanded first.
Match exec "true"
    User exec-true

Match exec "false"
    Port 9999

Match exec "test %h = x"
    Tag host-is-x

Match !exec "false"
    Compression yes

Match exec "false" exec "echo should-not-matter"
    BatchMode yes

Match host y exec "true"
    ServerAliveInterval 3
