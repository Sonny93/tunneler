# aliases: web1 web2 web10 db1 prod-db1 skip-me other Web1 a.b
# Wildcards, `?`, negation, and the case-sensitivity of Host patterns.
Host web?
    User question

Host web*
    Port 2201

Host !prod-* *db*
    Tag dbhost

Host *
    Compression yes

Host !skip-me *
    BatchMode yes

Host *.b
    User dotted

Host Web1
    User capitalised

Host !web1 web* other
    ServerAliveInterval 7
