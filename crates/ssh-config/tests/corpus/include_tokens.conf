# aliases: alpha beta
# Include paths expand tokens with the state at that point: %h is the Hostname set so far, %n the alias.
Include @DIR@/by_host/%h.conf
Include @DIR@/by_alias/%n.conf

Host alpha
    HostName beta
    Include @DIR@/by_host/%h.conf

Match originalhost beta
    Include ${HOME}/../../nonexistent-%h.conf
#@file by_host/alpha.conf
Tag from-alpha-file
#@file by_host/beta.conf
User beta-user
#@file by_alias/alpha.conf
Port 4242
