# aliases: web db Quoted spaced mixedcase
# Basics: plain values, `=` syntax, quotes, trailing comments, case-insensitive keywords.
Host web
    HostName web.example.com
    Port 2222
    User deploy
    IdentityFile ~/.ssh/web_key

Host db
    hostname=db.example.com
    PORT = 5432   # trailing comment
    user    =   dba
    IdentitiesOnly yes   # another comment
    Compression=yes

Host Quoted
    HostName "quoted.example.com"
    IdentityFile "@DIR@/key with space"
    User 'single'

Host spaced
HostName   spaced.example.com
	Port	2200

HoSt mixedcase
  HOSTNAME MixedCase.Example.COM
  uSeR Someone
  StrictHostKeyChecking=accept-new
