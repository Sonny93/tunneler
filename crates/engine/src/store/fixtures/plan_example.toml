version = 1

[settings]
default_bind_address = "127.0.0.1"
default_remote_bind_address = "localhost"
keepalive_interval_s = 15
keepalive_max = 3
session_idle_grace_s = 30
reconnect_initial_delay_ms = 1000
reconnect_max_delay_ms = 60000
restore_on_launch = true          # restarts the tunnels that were active at the last exit
start_on_launch_tags = []         # tags started when the daemon launches
launch_at_login = false
use_os_keyring = false            # keeps remembered passphrases in the OS keyring
x11_display = ""                  # empty = $DISPLAY, or 127.0.0.1:0.0 on Windows
open_host = "localhost"           # localhost | ip (127.0.0.1, or [::1] when the tunnel listens on IPv6)
open_default = "suggested"        # suggested | browser, what a tunnel without an application opens with
standby = false                   # local/dynamic tunnels hold their port without an SSH session until a client connects
standby_idle_s = 300              # back to standby after this long without a connection
standby_notify = "visual"         # none | visual | sound | both, when a standby tunnel wakes up or fails to
standby_sound = "pluck"           # system | chime | marimba | pluck, the sound played in sound mode
standby_volume = 50               # 5 to 100 (%), the volume of the chime, marimba and pluck sounds; system follows the system volume
language = "system"               # system | en | fr, the language of the UI, tray and notifications; system follows the OS
check_for_updates = true          # the UI looks for a newer release when it opens

[[tunnels]]
id = "01JA0000000000000000000000"  # ULID
host = "nova"                     # alias from ~/.ssh/config
kind = "local"                    # local | remote | dynamic
listen_port = 3333
# listen_address = "0.0.0.0"      # overrides the default
# target_host = "127.0.0.1"
# target_port = 3333              # default = listen_port
tags = ["dev", "adonis"]
# open = { scheme = "https", path = "/admin", host = "ip" }
# standby = true                  # overrides settings.standby

[hosts.nova]                      # app-specific overrides, per alias
x11_display = "198.51.100.135:0.0"

[[x11_launchers]]
host = "nova"
name = "VS Code"
command = "code --wait"
