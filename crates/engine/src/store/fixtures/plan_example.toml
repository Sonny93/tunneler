version = 1

[settings]
default_bind_address = "127.0.0.1"
default_remote_bind_address = "localhost"
keepalive_interval_s = 15
keepalive_max = 3
session_idle_grace_s = 30
reconnect_initial_delay_ms = 1000
reconnect_max_delay_ms = 60000
health_probe = true
restore_on_launch = true          # restarts the tunnels that were active at the last exit
start_on_launch_tags = []         # tags started when the daemon launches
launch_at_login = false
use_os_keyring = false            # keeps remembered passphrases in the OS keyring
x11_display = ""                  # empty = $DISPLAY, or 127.0.0.1:0.0 on Windows

[[tunnels]]
id = "01JA0000000000000000000000"  # ULID
name = "Adonis"
host = "nova"                     # alias from ~/.ssh/config
kind = "local"                    # local | remote | dynamic
listen_port = 3333
# listen_address = "0.0.0.0"      # overrides the default
# target_host = "127.0.0.1"
# target_port = 3333              # default = listen_port
tags = ["dev", "adonis"]

[hosts.nova]                      # app-specific overrides, per alias
x11_display = "198.51.100.135:0.0"

[[x11_launchers]]
host = "nova"
name = "VS Code"
command = "code --wait"
