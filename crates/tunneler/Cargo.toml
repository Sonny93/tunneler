[package]
name = "tunneler"
description = "Tunneler daemon, CLI and tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
clap.workspace = true
directories.workspace = true
engine = { path = "../engine" }
ipc = { path = "../ipc" }
keyring.workspace = true
open.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
ssh-config.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
tray-icon = { workspace = true, features = ["ksni"] }
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification.workspace = true
tray-icon.workspace = true
winit.workspace = true
windows-sys.workspace = true
winreg.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
russh.workspace = true
tempfile.workspace = true
test-support.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
