[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
directories = "6"
getrandom = "0.4"
glob = "0.3"
hmac = "0.13"
interprocess = { version = "2.4", default-features = false, features = ["tokio"] }
known-hosts = { path = "crates/known-hosts" }
notify = "8"
notify-debouncer-mini = { version = "0.7", default-features = false }
pretty_assertions = "1"
rustix = { version = "1", features = ["process"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha1_smol = "1"
sha2 = "0.11"
ssh-config = { path = "crates/ssh-config" }
tempfile = "3"
thiserror = "2"
toml_edit = { version = "0.25", features = ["serde"] }
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
ulid = { version = "3", features = ["serde"] }
whoami = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
