[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fast-socks5 = { version = "1", default-features = false }
getrandom = "0.4"
glob = "0.3"
hmac = "0.13"
interprocess = { version = "2.4", default-features = false, features = ["tokio"] }
keyring = "4"
known-hosts = { path = "crates/known-hosts" }
listeners = "0.6"
notify = "8"
notify-debouncer-mini = { version = "0.7", default-features = false }
open = "5"
pretty_assertions = "1"
rustix = { version = "1", features = ["process"] }
rpassword = "7"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha1_smol = "1"
sha2 = "0.11"
ssh-config = { path = "crates/ssh-config" }
sys-locale = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
test-support = { path = "crates/test-support" }
thiserror = "2"
toml_edit = { version = "0.25", features = ["serde"] }
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tokio-util = { version = "0.7", default-features = false }
tray-icon = { version = "0.26", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
ulid = { version = "3", features = ["serde"] }
whoami = "2"
winit = { version = "0.30", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Console"] }
tauri-winrt-notification = "0.8"
winreg = "0.56"
winresource = { version = "0.1", default-features = false }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
